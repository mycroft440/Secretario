name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          # Android 17/Cinnamon Bun is currently published by sdkmanager as
          # android-37.0 even though Gradle's compileSdk remains integer 37.
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Validate FunctionGemma seed dataset
        run: python3 training/validate_dataset.py

      - name: Unit tests — public and privileged
        run: >-
          gradle --no-daemon
          :app:testPublicDebugUnitTest
          :app:testPrivilegedDebugUnitTest
          --stacktrace

      - name: Android lint — public and privileged
        run: >-
          gradle --no-daemon
          :app:lintPublicDebug
          :app:lintPublicRelease
          :app:lintPrivilegedDebug
          :app:lintPrivilegedRelease
          --stacktrace

      - name: Build public debug APK
        run: gradle --no-daemon :app:assemblePublicDebug --stacktrace

      - name: Build public release APK and AAB
        run: >-
          gradle --no-daemon
          :app:assemblePublicRelease
          :app:bundlePublicRelease
          --stacktrace

      - name: Build privileged OEM release APK
        run: gradle --no-daemon :app:assemblePrivilegedRelease --stacktrace

      - name: Prepare public release artifacts
        id: release
        env:
          CALLGUARD_KEYSTORE_B64: ${{ secrets.CALLGUARD_KEYSTORE_B64 }}
          CALLGUARD_KEY_ALIAS: ${{ secrets.CALLGUARD_KEY_ALIAS }}
          CALLGUARD_KEYSTORE_PASSWORD: ${{ secrets.CALLGUARD_KEYSTORE_PASSWORD }}
          CALLGUARD_KEY_PASSWORD: ${{ secrets.CALLGUARD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          RELEASE_APK="app/build/outputs/apk/public/release/app-public-release-unsigned.apk"
          RELEASE_AAB="app/build/outputs/bundle/publicRelease/app-public-release.aab"
          test -f "$RELEASE_APK"
          test -f "$RELEASE_AAB"

          if [[ -n "${CALLGUARD_KEYSTORE_B64:-}" && -n "${CALLGUARD_KEY_ALIAS:-}" && -n "${CALLGUARD_KEYSTORE_PASSWORD:-}" && -n "${CALLGUARD_KEY_PASSWORD:-}" ]]; then
            echo "Release signing secrets detected; signing public APK and AAB."
            KEYSTORE="$RUNNER_TEMP/callguard-release.jks"
            printf '%s' "$CALLGUARD_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

            SIGNED_APK="release-artifacts/CallGuardAI-v0.1.0-release-signed.apk"
            SIGNED_AAB="release-artifacts/CallGuardAI-v0.1.0-release-signed.aab"

            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$CALLGUARD_KEY_ALIAS" \
              --ks-pass env:CALLGUARD_KEYSTORE_PASSWORD \
              --key-pass env:CALLGUARD_KEY_PASSWORD \
              --out "$SIGNED_APK" \
              "$RELEASE_APK"

            jarsigner \
              -keystore "$KEYSTORE" \
              -storepass "$CALLGUARD_KEYSTORE_PASSWORD" \
              -keypass "$CALLGUARD_KEY_PASSWORD" \
              -signedjar "$SIGNED_AAB" \
              "$RELEASE_AAB" \
              "$CALLGUARD_KEY_ALIAS"

            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$SIGNED_APK"
            jarsigner -verify "$SIGNED_AAB"
            rm -f "$KEYSTORE"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No complete release keystore secrets found; publishing clearly marked unsigned public artifacts."
            cp "$RELEASE_APK" "release-artifacts/CallGuardAI-v0.1.0-release-unsigned.apk"
            cp "$RELEASE_AAB" "release-artifacts/CallGuardAI-v0.1.0-release-unsigned.aab"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

          (cd release-artifacts && sha256sum CallGuardAI-* > SHA256SUMS.txt)

      - name: Prepare privileged OEM artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p privileged-artifacts
          OEM_APK="app/build/outputs/apk/privileged/release/app-privileged-release-unsigned.apk"
          test -f "$OEM_APK"
          cp "$OEM_APK" "privileged-artifacts/CallGuardAI-v0.1.0-privileged-oem-unsigned.apk"
          cat > privileged-artifacts/README.txt <<'EOF'
          This APK is NOT a normal end-user release.
          It contains SystemApi/OEM PSTN audio integration and must receive the
          platform/OEM signing and permission policy required for
          android.permission.CALL_AUDIO_INTERCEPTION. A normal APK install does
          not gain that capability merely by declaring the permission.
          EOF
          (cd privileged-artifacts && sha256sum CallGuardAI-* > SHA256SUMS.txt)

      - name: Upload public debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CallGuardAI-debug
          path: app/build/outputs/apk/public/debug/app-public-debug.apk
          if-no-files-found: error

      - name: Upload public release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: CallGuardAI-release
          path: release-artifacts/
          if-no-files-found: error

      - name: Upload privileged OEM APK
        uses: actions/upload-artifact@v7
        with:
          name: CallGuardAI-privileged-oem
          path: privileged-artifacts/
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CallGuardAI-reports
          path: app/build/reports/
          if-no-files-found: ignore
